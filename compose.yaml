services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    restart: unless-stopped
    environment:
      POSTGRES_DB: navigator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    secrets:
      - db_admin_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d navigator"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    build:
      context: ./backend
      target: migrate
    user: "${APP_UID:-65532}:${APP_GID:-65532}"
    read_only: true
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url_migrate
      APP_DATABASE_URL_FILE: /run/secrets/database_url_api
      MIGRATIONS_DIR: /migrations
    secrets:
      - database_url_migrate
      - database_url_api
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  api:
    build:
      context: ./backend
      target: authapi
    user: "${APP_UID:-65532}:${APP_GID:-65532}"
    read_only: true
    restart: unless-stopped
    environment:
      APP_ENV: local
      HTTP_ADDR: 0.0.0.0:8081
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      MAX_BOT_TOKEN_FILE: /run/secrets/bot_token
      MAX_WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      IDENTITY_LOOKUP_KEY_V1_FILE: /run/secrets/lookup_key
      DATA_KEY_V1_FILE: /run/secrets/data_key
      DATABASE_URL_FILE: /run/secrets/database_url_api
      MAX_WORKER_ENABLED: "0"
      MAX_API_BASE_URL: https://platform-api2.max.ru
    secrets:
      - bot_token
      - webhook_secret
      - lookup_key
      - data_key
      - database_url_api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend]

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    networks: [backend]

secrets:
  db_admin_password:
    file: ./.local/secrets/db-admin-password
  database_url_migrate:
    file: ./.local/secrets/database-url-migrate
  database_url_api:
    file: ./.local/secrets/database-url-api
  bot_token:
    file: ./.local/secrets/bot-token
  webhook_secret:
    file: ./.local/secrets/webhook-secret
  lookup_key:
    file: ./.local/secrets/lookup-key
  data_key:
    file: ./.local/secrets/data-key

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  backend:
