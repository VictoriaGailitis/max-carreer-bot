# Optional override for host-built assets; the default Compose builds frontend in Docker.
# Build frontend/ first. FRONTEND_DIST defaults to ./frontend/dist.
# Local: docker compose -f compose.yaml -f deploy/compose.frontend.yaml up --build -d
# Production: add deploy/compose.production.yaml before deploy/compose.frontend.yaml.
services:
  proxy:
    volumes:
      - ./deploy/caddy/Caddyfile.frontend:/etc/caddy/Caddyfile:ro
      - type: bind
        source: "${FRONTEND_DIST:-./frontend/dist}"
        target: /srv/frontend
        read_only: true
        bind:
          create_host_path: false
